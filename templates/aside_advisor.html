<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop().replace('.php','') || 'advisor';
    document.querySelectorAll('.bottom-nav a').forEach(link => {
        if (link.dataset.page === currentPage) {
            link.classList.add('active');
        }
    });

    const modal = document.getElementById('notifModal');
    const openDesktop = document.getElementById('openNotifDesktop');
    const openMobile = document.getElementById('openNotifMobile');
    const closeBtn = document.getElementById('closeNotif');

    openDesktop?.addEventListener('click', () => modal.classList.add('active'));
    openMobile?.addEventListener('click', () => modal.classList.add('active'));
    closeBtn.addEventListener('click', () => modal.classList.remove('active'));

    modal.addEventListener('click', e => {
        if (e.target === modal) modal.classList.remove('active');
    });
});

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icon = type === 'success' ? 'ri-checkbox-circle-line' : 'ri-error-warning-line';
    toast.innerHTML = `<i class="${icon}"></i><span>${message}</span>`;
    
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

async function markAsReadAdvisor(notificationId) {
    try {
        const formData = new FormData();
        formData.append('action', 'mark_read');
        formData.append('notification_id', notificationId);
        
        const response = await fetch('php/mark_notification_read.php', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            const notifCard = document.querySelector(`.notification-item[data-notif-id="${notificationId}"]`);
            if (notifCard) {
                notifCard.classList.remove('unread');
                notifCard.classList.add('read');
                
                const newBadge = notifCard.querySelector('.new-badge');
                if (newBadge) newBadge.remove();
                
                const markReadBtn = notifCard.querySelector('.mark-read-btn');
                if (markReadBtn) markReadBtn.remove();
            }
            
            updateBadgeCount(-1);
            showToast('Marked as read', 'success');
        } else {
            showToast(data.message || 'Failed to mark as read', 'error');
        }
    } catch (error) {
        showToast('Network error occurred', 'error');
    }
}

async function deleteNotificationAdvisor(notificationId) {
    try {
        const formData = new FormData();
        formData.append('action', 'delete');
        formData.append('notification_id', notificationId);
        
        const response = await fetch('php/mark_notification_read.php', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            const notifCard = document.querySelector(`.notification-item[data-notif-id="${notificationId}"]`);
            if (notifCard) {
                const wasUnread = notifCard.classList.contains('unread');
                
                notifCard.style.opacity = '0';
                notifCard.style.transform = 'translateX(400px)';
                notifCard.style.transition = 'all 0.3s ease';
                
                setTimeout(() => {
                    notifCard.remove();
                    
                    const remainingCards = document.querySelectorAll('.notification-item');
                    if (remainingCards.length === 0) {
                        const notifBody = document.querySelector('.notif-body');
                        notifBody.innerHTML = `
                            <div class="no-notifs">
                                <i class="ri-notification-off-line"></i>
                                <p>No notifications</p>
                            </div>
                        `;
                    }
                }, 300);
                
                if (wasUnread) {
                    updateBadgeCount(-1);
                }
            }
            
            showToast('Notification deleted', 'success');
        } else {
            showToast(data.message || 'Failed to delete notification', 'error');
        }
    } catch (error) {
        showToast('Network error occurred', 'error');
    }
}

function updateBadgeCount(change) {
    const badge = document.getElementById('notifCount');
    const badgeMobile = document.querySelector('.notif-badge-mobile');
    
    if (badge) {
        let count = parseInt(badge.textContent) + change;
        if (count <= 0) {
            badge.remove();
        } else {
            badge.textContent = count;
        }
    }
    
    if (badgeMobile) {
        let count = parseInt(badgeMobile.textContent) + change;
        if (count <= 0) {
            badgeMobile.remove();
        } else {
            badgeMobile.textContent = count;
        }
    }
}
</script>
